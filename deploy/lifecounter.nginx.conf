# lifecounter.mreis.site — site estático (o app web) + API Django + media (fotos/APK)
# Instalado em /etc/nginx/conf.d/lifecounter.conf. O certbot adiciona o bloco SSL.
server {
    listen 80;
    server_name lifecounter.mreis.site;

    client_max_body_size 80M;

    # O app web (index.html, src/js, src/styles, mp3...) — enviado pelo deploy.ps1
    root /root/lifecounter/site;
    index index.html;

    # Nunca cachear o HTML/JS/CSS do app: quem abre o site pega sempre a versão nova.
    location ~* \.(html|js|css|webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /media/ {
        alias /root/lifecounter/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /root/lifecounter/backend/staticfiles/;
        expires 30d;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8013;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
